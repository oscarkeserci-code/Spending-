<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spending</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mu:#6b7280;--ln:#e5e7eb;--ac:#0b8794;--ac2:#e0f4f5;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1518;--card:#142024;--tx:#eef0f4;--mu:#9aa3b2;--ln:#223238;--ac:#5eead4;--ac2:#14302f;--on:#05201e}}
:root[data-theme="dark"]{--bg:#0d1518;--card:#142024;--tx:#eef0f4;--mu:#9aa3b2;--ln:#223238;--ac:#5eead4;--ac2:#14302f;--on:#05201e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:9px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac2);color:var(--ac)}
button,input,select{font:inherit;color:var(--tx)}
.btn{border:0;background:var(--ac);color:var(--on);padding:10px 14px;border-radius:10px;font-weight:600}
.btn.sec{background:var(--ac2);color:var(--ac)}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:8px;min-width:0}
.big{font-size:30px;font-weight:700}
.mu{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tx{padding:10px 0;border-top:1px solid var(--ln)}
.tx:first-child{border-top:0}
.x{border:0;background:none;color:var(--mu);font-size:18px}
.cols{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:10px}
.cols div{flex:1;text-align:center;font-size:10px;color:var(--mu)}
.cols b{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.rev{border:1px solid var(--ac)}
.rv{padding:10px 0;border-top:1px solid var(--ln)}
.rv input[type=text]{width:100%;margin-top:6px}
.new{font-size:11px;background:var(--ac2);color:var(--ac);padding:1px 6px;border-radius:6px}
</style></head><body><main>
<div class="row sp"><h1>Spending</h1><select id="yr"></select></div>
<div class="tabs" id="tabs"></div>
<div id="rev"></div>
<div id="view"></div>
<input type="file" id="imp" accept=".json" hidden>
</main>
<script>
var COLORS=['#0b8794','#0ea5e9','#10b981','#f59e0b','#ef4444','#38bdf8','#2dd4bf','#14b8a6'];
function seed(){
 var cats=[{id:'c1',name:'Groceries',color:COLORS[2]},{id:'c2',name:'Coffee',color:COLORS[3]},{id:'c3',name:'Insurance',color:COLORS[1]},{id:'c4',name:'Betting',color:COLORS[4]},{id:'c5',name:'Transport',color:COLORS[7]}],tx=[],n=0;
 function a(d,m,v,c){tx.push({id:'d'+(n++),date:d,merchant:m,amount:v,cat:c})}
 for(var mo=1;mo<=9;mo++){var M='2026-'+String(mo).padStart(2,'0')+'-';
  a(M+'01','LokalTapiola',49.88,'c3');
  a(M+'04','K-Market',22+(mo*7)%19,'c1');a(M+'12','S-Market',31+(mo*11)%23,'c1');a(M+'21','K-Market',18+(mo*5)%17,'c1');
  a(M+'06','Cafetino',4,'c2');a(M+'14','ABC',2+(mo%3)*0.5,'c2');a(M+'23','Cafetino',4.5,'c2');
  a(M+'08','BET365',5*(1+mo%3),'c4');a(M+'17','HSL',2.9*(2+mo%4),'c5')}
 a('2026-10-01','LokalTapiola',49.88,'c3');a('2026-10-01','BET365',5,'c4');a('2026-10-02','KESERCI OSCAR',1,'c1');a('2026-10-02','ABC',2,'c2');
 a('2026-10-03','BET365',5,'c4');a('2026-10-03','Cafetino',4,'c2');a('2026-10-04','R_KIRKKONUMMI_Keskus',8.29,'c1');a('2026-10-05','KESERCI OSCAR',0.5,'c1');a('2026-10-06','HSL',5.8,'c5');
 var r={};tx.forEach(function(t){r[t.merchant.toLowerCase()]=t.cat});
 return{cats:cats,tx:tx,rules:r,demo:true}}
var S=seed();S.tx=[];S.rules={};S.demo=false;S.cats=S.cats.filter(function(c){return c.id!=='c4'});
try{var raw=localStorage.getItem('spending-v1');if(raw)S=JSON.parse(raw)}catch(e){}
var now=new Date(),tab='month',ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),year=now.getFullYear(),review=null,sample=null,msg='';
function save(){try{localStorage.setItem('spending-v1',JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function eur(n){return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function cat(id){return S.cats.find(function(c){return c.id===id})||{name:'Uncategorized',color:'#9ca3af'}}
function catByName(n){n=n.trim().toLowerCase();return S.cats.find(function(c){return c.name.toLowerCase()===n})}
function sumBy(list){var m={};list.forEach(function(t){m[t.cat||'']=(m[t.cat||'']||0)+t.amount});return Object.keys(m).map(function(k){return{id:k,v:m[k]}}).sort(function(a,b){return b.v-a.v})}
function bars(list){var tot=list.reduce(function(a,t){return a+t.amount},0),rows=sumBy(list);
 if(!rows.length)return '<p class="mu">No spending yet.</p>';
 return rows.map(function(r){var c=cat(r.id);return '<div style="margin-top:10px"><div class="row sp"><span class="row"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+'</span><b>'+eur(r.v)+'</b></div><div class="bar"><i style="width:'+(r.v/tot*100)+'%;background:'+c.color+'"></i></div></div>'}).join('')}
function opts(sel){return '<option value="">Uncategorized</option>'+S.cats.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')}
function render(){
 var ys={};S.tx.forEach(function(t){ys[t.date.slice(0,4)]=1});ys[year]=1;ys[now.getFullYear()]=1;
 document.getElementById('yr').innerHTML=Object.keys(ys).sort().map(function(y){return '<option'+(+y===year?' selected':'')+'>'+y+'</option>'}).join('');
 document.getElementById('tabs').innerHTML=['month','year','categories','backup'].map(function(t){return '<button class="'+(tab===t?'on':'')+'" onclick="tab=\''+t+'\';render()">'+t[0].toUpperCase()+t.slice(1)+'</button>'}).join('');
 renderReview();
 var h=(due()?'<div class="card" style="background:var(--ac2)"><div class="row sp"><span>Monthly backup is due</span><button class="btn" onclick="tab=\'backup\';render()">Open</button></div></div>':'')+(S.demo?'<div class="card" style="background:var(--ac2)"><div class="row sp"><span class="mu">Showing example data</span><button class="btn" onclick="clearDemo()">Start fresh</button></div></div>':'')+'<div style="margin-bottom:12px"><button class="btn" style="width:100%" onclick="manual()">+ Add spending</button></div>'+(msg?'<p class="mu">'+esc(msg)+'</p>':'');
 if(tab==='month'){
  var list=S.tx.filter(function(t){return t.date.slice(0,7)===ym}).sort(function(a,b){return b.date.localeCompare(a.date)}),tot=list.reduce(function(a,t){return a+t.amount},0);
  h+='<div class="card"><div class="row sp"><button class="x" onclick="mv(-1)">‹</button><b>'+new Date(ym+'-01').toLocaleString('en',{month:'long',year:'numeric'})+'</b><button class="x" onclick="mv(1)">›</button></div><div class="big">'+eur(tot)+'</div><div class="mu">spent this month</div>'+bars(list)+'</div>';
  h+='<div class="card"><b>Transactions</b>'+(list.length?'':'<p class="mu">Nothing here yet. Tap + Add spending to start.</p>')+list.map(function(t){return '<div class="tx"><div class="row sp"><span>'+esc(t.merchant)+'<div class="mu">'+t.date.slice(8)+'.'+t.date.slice(5,7)+'.</div></span><span class="row"><b>'+eur(t.amount)+'</b><button class="x" onclick="del(\''+t.id+'\')">×</button></span></div><select style="margin-top:6px;width:100%" onchange="setCat(\''+t.id+'\',this.value)">'+opts(t.cat)+'</select></div>'}).join('')+'</div>';
 }else if(tab==='year'){
  var yl=S.tx.filter(function(t){return t.date.slice(0,4)==year}),m=[];for(var i=0;i<12;i++)m.push(0);
  yl.forEach(function(t){m[+t.date.slice(5,7)-1]+=t.amount});var mx=Math.max.apply(null,m)||1,tt=m.reduce(function(a,b){return a+b},0);
  h+='<div class="card"><div class="big">'+eur(tt)+'</div><div class="mu">spent in '+year+' · avg '+eur(tt/12)+'/month</div><div class="cols">'+m.map(function(v,i){return '<div><b style="height:'+(v/mx*90)+'px"></b>'+'JFMAMJJASOND'[i]+'</div>'}).join('')+'</div></div><div class="card"><b>By category</b>'+bars(yl)+'</div>';
 }else if(tab==='backup'){
  h+=backupView();
 }else{
  h+='<div class="card"><b>Categories</b>'+S.cats.map(function(c){return '<div class="row tx"><input type="color" value="'+c.color+'" style="width:40px;padding:2px" onchange="edit(\''+c.id+'\',\'color\',this.value)"><input style="flex:1" value="'+esc(c.name)+'" onchange="edit(\''+c.id+'\',\'name\',this.value)"><button class="x" onclick="rmCat(\''+c.id+'\')">🗑</button></div>'}).join('')+'<div class="row" style="margin-top:10px"><input id="nc" placeholder="New category" style="flex:1"><button class="btn" onclick="addCat()">Add</button></div></div><p class="mu">Deleting a category moves its transactions to Uncategorized.</p>';
 }
 document.getElementById('view').innerHTML=h;
}
function clearDemo(){if(!confirm('Remove all example data?'))return;S={cats:S.cats,tx:[],rules:{}};save();render()}
function mv(d){var p=ym.split('-'),dt=new Date(+p[0],+p[1]-1+d,1);ym=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');year=dt.getFullYear();render()}
function del(id){S.tx=S.tx.filter(function(t){return t.id!==id});save();render()}
function setCat(id,c){S.tx.forEach(function(t){if(t.id===id){t.cat=c;if(c)S.rules[t.merchant.toLowerCase()]=c}});save();render()}
function edit(id,k,v){v=v.trim();if(!v)return render();S.cats.forEach(function(c){if(c.id===id)c[k]=v});save();render()}
function rmCat(id){if(!confirm('Delete this category?'))return;S.cats=S.cats.filter(function(c){return c.id!==id});S.tx.forEach(function(t){if(t.cat===id)t.cat=''});for(var k in S.rules)if(S.rules[k]===id)delete S.rules[k];save();render()}
function addCat(){var v=document.getElementById('nc').value.trim();if(!v||catByName(v))return;S.cats.push({id:uid(),name:v,color:COLORS[S.cats.length%COLORS.length]});save();render()}
document.getElementById('yr').onchange=function(){year=+this.value;ym=year+'-'+ym.slice(5);render()};
function manual(){var d=new Date().toISOString().slice(0,10);review=[{date:d,merchant:'',amount:0,catName:''}];render()}
function renderReview(){
 var el=document.getElementById('rev');if(!review){el.innerHTML='';return}
 el.innerHTML='<div class="card rev"><b>Review before adding</b><p class="mu">Pick or type a category. The same merchant name is remembered next time.</p><datalist id="dl">'+S.cats.map(function(c){return '<option value="'+esc(c.name)+'">'}).join('')+'</datalist>'+
 review.map(function(r,i){var isNew=r.catName&&!catByName(r.catName);return '<div class="rv"><div class="row sp"><input type="text" style="margin:0;flex:1" value="'+esc(r.merchant)+'" placeholder="Merchant" onchange="review['+i+'].merchant=this.value"><input type="number" step="0.01" style="width:90px" value="'+r.amount+'" onchange="review['+i+'].amount=Math.abs(+this.value)"><button class="x" onclick="review.splice('+i+',1);if(!review.length)review=null;render()">×</button></div><div class="row" style="margin-top:6px"><input type="date" value="'+r.date+'" onchange="review['+i+'].date=this.value"></div><input type="text" list="dl" placeholder="Category" value="'+esc(r.catName)+'" onchange="review['+i+'].catName=this.value;render()">'+(isNew?' <span class="new">new category</span>':'')+'</div>'}).join('')+
 '<button class="btn sec" style="margin-top:10px;width:100%" onclick="review.push({date:review[review.length-1].date,merchant:\'\',amount:0,catName:\'\'});render()">+ Add another row</button><div class="row" style="margin-top:12px"><button class="btn" style="flex:1" onclick="commit()">Add '+review.length+' to Spending</button><button class="btn sec" onclick="review=null;render()">Cancel</button></div></div>';
}
function commit(){
 review.forEach(function(r){if(!r.merchant||!r.amount)return;var c=r.catName.trim()?catByName(r.catName):null;
  if(r.catName.trim()&&!c){c={id:uid(),name:r.catName.trim(),color:COLORS[S.cats.length%COLORS.length]};S.cats.push(c)}
  if(c)S.rules[r.merchant.toLowerCase()]=c.id;
  S.tx.push({id:uid(),date:r.date,merchant:r.merchant,amount:r.amount,cat:c?c.id:''})});
 var f=review.length&&review[0].date;review=null;if(f){ym=f.slice(0,7);year=+f.slice(0,4)}save();tab='month';render()}
function toReview(rows){
 review=rows.map(function(r){var rule=S.rules[String(r.merchant).toLowerCase()],c=rule?cat(rule):null;
  return{date:r.date,merchant:String(r.merchant),amount:Math.abs(+r.amount),catName:c?c.name:(r.suggestion||'')}});render();window.scrollTo(0,0)}

var EMAIL='oscarkeserci@gmail.com';
function due(){if(S.demo||!S.tx.length)return false;return (S.lastBackup||'').slice(0,7)!==new Date().toISOString().slice(0,7)}
function monthTx(){return S.tx.filter(function(t){return t.date.slice(0,7)===ym}).sort(function(a,b){return a.date.localeCompare(b.date)})}
function reportText(){var l=monthTx(),tot=l.reduce(function(a,t){return a+t.amount},0),t='Spending report '+new Date(ym+'-01').toLocaleString('en',{month:'long',year:'numeric'})+'\nTotal: '+eur(tot)+'\n\nBy category:\n';
 sumBy(l).forEach(function(r){t+='- '+cat(r.id).name+': '+eur(r.v)+'\n'});t+='\nTransactions:\n';l.forEach(function(x){t+=x.date+'  '+x.merchant+'  '+eur(x.amount)+'  ['+cat(x.cat).name+']\n'});return t}
function mailHref(){var b=reportText();if(b.length>1800)b=b.slice(0,1800)+'\n…(truncated, see downloaded CSV)';return 'mailto:'+EMAIL+'?subject='+encodeURIComponent('Spending report '+ym)+'&body='+encodeURIComponent(b)}
function dl(name,data){try{var b=new Blob([data],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();msg='Saved '+name}catch(e){msg='Could not save the file'}render()}
function csv(){return 'date,merchant,amount,category\n'+monthTx().map(function(t){return [t.date,'"'+t.merchant.replace(/"/g,'""')+'"',t.amount.toFixed(2),'"'+cat(t.cat).name+'"'].join(',')}).join('\n')}
function backup(){S.lastBackup=new Date().toISOString();save();dl('spending-backup-'+S.lastBackup.slice(0,10)+'.json',JSON.stringify(S))}
var mailAfter=false;
function backupMail(){return 'mailto:'+EMAIL+'?subject='+encodeURIComponent('Spending backup '+(S.lastBackup||'').slice(0,10))+'&body='+encodeURIComponent('Attach the downloaded file spending-backup-'+(S.lastBackup||'').slice(0,10)+'.json to this email and send.')}
async function emailBackup(){S.lastBackup=new Date().toISOString();save();var name='spending-backup-'+S.lastBackup.slice(0,10)+'.json',json=JSON.stringify(S),f=null;
 try{f=new File([json],name,{type:'application/json'})}catch(e){}
 try{if(f&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Spending backup',text:'Spending backup '+S.lastBackup.slice(0,10)});msg='Choose your email app in the share sheet and send to '+EMAIL;return render()}}catch(e){if(e&&e.name==='AbortError')return}
 mailAfter=true;await dl(name,json)}
function backupView(){return '<div class="card"><b>Monthly report</b><p class="mu">Report for '+new Date(ym+'-01').toLocaleString('en',{month:'long',year:'numeric'})+' (change month on the Month tab).</p><div class="row"><a class="btn" style="text-decoration:none;flex:1;text-align:center" href="'+mailHref()+'" target="_top">✉️ Email to '+EMAIL+'</a></div><p class="mu">Opens your mail app with the report filled in. Attachments are not possible from here, so use the CSV if you want a file.</p><button class="btn sec" onclick="dl(\'spending-\'+ym+\'.csv\',csv())">Download CSV</button></div>'+
 '<div class="card"><b>Backup</b><p class="mu">Your data lives only in this browser. Export a backup regularly, ideally on the 1st of each month.</p><button class="btn" style="width:100%;margin-bottom:8px" onclick="emailBackup()">✉️ Export &amp; email backup</button>'+(mailAfter?'<a class="btn sec" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px" href="'+backupMail()+'" target="_top">Step 2: open email to attach the file</a>':'')+'<div class="row"><button class="btn sec" onclick="backup()">Export only</button><button class="btn sec" onclick="document.getElementById(\'imp\').click()">Import backup</button></div><p class="mu">Last backup: '+(S.lastBackup?S.lastBackup.slice(0,10):'never')+'</p></div>'}
document.getElementById('imp').onchange=function(){var f=this.files[0];this.value='';if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.cats||!o.tx)throw 0;if(!confirm('Replace current data with this backup?'))return;S=o;S.demo=false;save();msg='Backup imported';}catch(e){msg='That file is not a valid backup'}render()};r.readAsText(f)};
render();
</script></body></html>
